<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" font-family="Arial, sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="820" height="280" fill="#0e1420" rx="6"/>
  <rect x="0" y="0" width="820" height="32" fill="#d7e2f2" rx="6"/>
  <rect x="0" y="16" width="820" height="16" fill="#d7e2f2"/>
  <text x="410" y="21" text-anchor="middle" fill="#141b2c" font-size="12" font-weight="bold">MEMORY.md 内部结构 — Markdown 分区设计</text>

  <!-- File card -->
  <rect x="40" y="50" width="740" height="220" rx="6" fill="#fff" stroke="#3b82f6" stroke-width="1.8" filter="url(#sh)"/>

  <!-- Header -->
  <rect x="40" y="50" width="740" height="28" rx="6" fill="#93c5fd"/>
  <rect x="40" y="64" width="740" height="14" fill="#93c5fd"/>
  <text x="60" y="69" font-size="10" font-weight="bold" fill="#fff">.axion/memory/MEMORY.md</text>

  <!-- Core -->
  <rect x="60" y="90" width="700" height="65" rx="5" fill="#0d2b21" stroke="#10b981" stroke-width="1.2"/>
  <text x="80" y="112" font-size="11" font-weight="bold" fill="#86efac">## 核心记忆 (scope=CORE)</text>
  <text x="80" y="130" font-size="9" fill="#6ee7b7">用户偏好 · 关键事实 · 项目背景 — 永远完整不截断</text>
  <text x="80" y="148" font-size="8" fill="#6ee7b7">save_memory(content, scope="CORE") 写入此区  ·  启动时全量注入 system prompt</text>

  <!-- Archival -->
  <rect x="60" y="165" width="700" height="65" rx="5" fill="#2a2110" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="80" y="187" font-size="11" font-weight="bold" fill="#fbbf24">## 归档记忆 (scope=ARCHIVAL)</text>
  <text x="80" y="205" font-size="9" fill="#fcd34d">对话记录 · 历史决策 — 超长时截断，recallByKeyword 在此检索</text>
  <text x="80" y="223" font-size="8" fill="#fbbf24">save_memory(content) 默认写入此区  ·  recall_memory 只在此区做关键词匹配</text>

  <!-- Truncation -->
  <rect x="60" y="240" width="700" height="24" rx="4" fill="#33151f" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="410" y="256" text-anchor="middle" font-size="9" font-weight="bold" fill="#fb7185">⚠ 超 4000 字截断（仅作用在归档记忆区） — 核心记忆区永远完整</text>
</svg>