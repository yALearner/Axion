<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="Arial, sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="820" height="330" fill="#0e1420" rx="6"/>
  <rect x="0" y="0" width="820" height="32" fill="#d7e2f2" rx="6"/>
  <rect x="0" y="16" width="820" height="16" fill="#d7e2f2"/>
  <text x="410" y="21" text-anchor="middle" fill="#141b2c" font-size="12" font-weight="bold">Plugin Tool 三档接入 — 门槛从低到高</text>

  <!-- Vertical indicator -->
  <rect x="770" y="52" width="25" height="245" rx="4" fill="#141b2c" stroke="#33435e" stroke-width="0.8"/>
  <text x="782" y="100" text-anchor="middle" font-size="7" fill="#7d8ca5" transform="rotate(90,782,100)">门槛 / 工程量</text>
  <polygon points="782,295 776,290 782,285 788,290" fill="#10b981"/>
  <text x="782" y="305" text-anchor="middle" font-size="6" fill="#10b981">低</text>
  <polygon points="782,52 776,57 782,62 788,57" fill="#3b82f6"/>
  <text x="782" y="48" text-anchor="middle" font-size="6" fill="#3b82f6">高</text>

  <!-- Tier 1: Zero -->
  <rect x="20" y="52" width="740" height="78" rx="8" fill="#0d2b21" stroke="#10b981" stroke-width="2" filter="url(#sh)"/>
  <rect x="20" y="52" width="10" height="78" rx="4" fill="#10b981"/>
  <text x="45" y="95" font-size="13" font-weight="bold" fill="#86efac">方式一</text>
  <text x="110" y="75" font-size="12" font-weight="bold" fill="#86efac">零代码 Agent 目录 + MCP</text>
  <text x="110" y="93" font-size="9" fill="#6ee7b7">门槛最低 ⭐ 主推 — 业务方只写 AGENT.md 目录描述任务，LLM 自主理解、组合调用 MCP 工具</text>
  <text x="110" y="112" font-size="8" fill="#6ee7b7">例："每天早上推送昨日 GitHub PR 评审进度到 Slack" → 复用 github-mcp + slack-mcp</text>
  <text x="110" y="126" font-size="7" fill="#6ee7b7">mcp_servers.yaml 配置 → McpClientService 启动子进程 → tools/list 获取工具列表</text>

  <!-- Tier 2: Light -->
  <rect x="20" y="140" width="740" height="78" rx="8" fill="#2a2110" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="20" y="140" width="10" height="78" rx="4" fill="#f59e0b"/>
  <text x="45" y="183" font-size="13" font-weight="bold" fill="#fbbf24">方式二</text>
  <text x="110" y="163" font-size="12" font-weight="bold" fill="#fbbf24">轻代码 自写 MCP Server</text>
  <text x="110" y="181" font-size="9" fill="#fcd34d">业务方用任意语言写 MCP server，配置在 mcp_servers.yaml — Axion 作为 MCP Client 启动时连接</text>
  <text x="110" y="200" font-size="8" fill="#fbbf24">JSON-RPC over stdio — tools/list 拿工具列表，tools/call 执行调用</text>
  <text x="110" y="216" font-size="7" fill="#fcd34d">适合接入企业自有系统 (ERP / CRM) · 任何语言皆可 · 安全隔离在独立进程</text>

  <!-- Tier 3: Heavy -->
  <rect x="20" y="228" width="740" height="78" rx="8" fill="#10203f" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="20" y="228" width="10" height="78" rx="4" fill="#3b82f6"/>
  <text x="45" y="271" font-size="13" font-weight="bold" fill="#93c5fd">方式三</text>
  <text x="110" y="251" font-size="12" font-weight="bold" fill="#93c5fd">重代码 Java @Tool 注解</text>
  <text x="110" y="269" font-size="9" fill="#93c5fd">Java Spring Bean + @Tool 注解 → 自动注册到 ToolRegistry，进程内直接调用</text>
  <text x="110" y="288" font-size="8" fill="#3b82f6">性能最好 (不走序列化、不起独立进程) · 适合深度集成企业 Java 服务</text>
  <text x="110" y="304" font-size="7" fill="#93c5fd">走 Spring AI @Tool → JSON Schema 生成 → AxionTool 包装 → ToolRegistry</text>

  <!-- Bottom -->
  <text x="410" y="326" font-size="8" fill="#9db0c9">三种方式均在 ToolRegistry 统一管理 · 均走 Sandbox 白名单校验 · 均写入 tool_invocations 审计</text>
</svg>