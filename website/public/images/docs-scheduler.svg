<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" font-family="Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 Z" fill="#7d8ca5"/></marker>
    <filter id="sh"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="820" height="260" fill="#0e1420" rx="6"/>
  <rect x="0" y="0" width="820" height="32" fill="#d7e2f2" rx="6"/>
  <rect x="0" y="16" width="820" height="16" fill="#d7e2f2"/>
  <text x="410" y="21" text-anchor="middle" fill="#141b2c" font-size="12" font-weight="bold">AgentScheduler — 三种触发源共用一个引擎</text>

  <!-- Three triggers -->
  <rect x="30" y="55" width="230" height="50" rx="6" fill="#10203f" stroke="#3b82f6" stroke-width="1.2" filter="url(#sh)"/>
  <text x="145" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#93c5fd">💻 CLI Channel</text>
  <text x="145" y="94" text-anchor="middle" font-size="9" fill="#3b82f6">axion chat · 人推</text>

  <rect x="295" y="55" width="230" height="50" rx="6" fill="#10203f" stroke="#3b82f6" stroke-width="1.2" filter="url(#sh)"/>
  <text x="410" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#93c5fd">🌐 Web Service</text>
  <text x="410" y="94" text-anchor="middle" font-size="9" fill="#3b82f6">REST API · 人推</text>

  <rect x="560" y="55" width="230" height="50" rx="6" fill="#0d2b21" stroke="#10b981" stroke-width="2" filter="url(#sh)"/>
  <text x="675" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#86efac">⏰ AgentScheduler</text>
  <text x="675" y="94" text-anchor="middle" font-size="9" fill="#86efac">Cron 到点自动 · 钟推</text>

  <!-- Arrows to AgentService -->
  <line x1="145" y1="105" x2="145" y2="132" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="410" y1="105" x2="410" y2="132" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="675" y1="105" x2="675" y2="132" stroke="#10b981" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- AgentService -->
  <rect x="260" y="137" width="300" height="34" rx="17" fill="#9db0c9" filter="url(#sh)"/>
  <text x="410" y="159" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">AgentService.process()</text>
  <line x1="410" y1="171" x2="410" y2="190" stroke="#7d8ca5" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- ReActLoop -->
  <rect x="290" y="194" width="240" height="32" rx="6" fill="#2a2110" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="410" y="215" text-anchor="middle" font-size="11" fill="#fbbf24">ReActLoop · 不感知消息来源</text>

  <!-- Scheduler detail left -->
  <rect x="35" y="132" width="160" height="68" rx="6" fill="#141b2c" stroke="#33435e" stroke-width="0.8"/>
  <text x="115" y="152" text-anchor="middle" font-size="9" font-weight="bold" fill="#7d8ca5">Scheduler 细节</text>
  <line x1="45" y1="158" x2="185" y2="158" stroke="#263248" stroke-width="0.5"/>
  <text x="45" y="175" font-size="8" fill="#7d8ca5">ThreadPoolTaskScheduler</text>
  <text x="45" y="190" font-size="8" fill="#7d8ca5">CronTrigger 动态注册</text>
  <text x="45" y="205" font-size="8" fill="#9db0c9">session_id: scheduler</text>

  <!-- Anti-overlap right -->
  <rect x="625" y="132" width="160" height="68" rx="6" fill="#141b2c" stroke="#33435e" stroke-width="0.8"/>
  <text x="705" y="152" text-anchor="middle" font-size="9" font-weight="bold" fill="#7d8ca5">防重叠</text>
  <line x1="635" y1="158" x2="775" y2="158" stroke="#263248" stroke-width="0.5"/>
  <text x="635" y="175" font-size="8" fill="#7d8ca5">ReentrantLock</text>
  <text x="635" y="190" font-size="8" fill="#7d8ca5">按 task_id 维度</text>
  <text x="635" y="205" font-size="8" fill="#9db0c9">跳过不排队</text>

  <!-- Bottom -->
  <text x="410" y="252" text-anchor="middle" font-size="8" fill="#9db0c9">原则八：CLI、Web、Scheduler 共用同一 AgentService.process() 引擎</text>
</svg>