  <text x="740.0" y="87" text-anchor="middle" font-size="8" fill="#9db0c9">RestClient：Boot builder + timeout（不变量 9）</text>
  <text x="740.0" y="101" text-anchor="middle" font-size="8" fill="#9db0c9">Map.of("webhook", webhookAdapter)</text>
  <text x="740.0" y="115" text-anchor="middle" font-size="8" fill="#9db0c9">NotifyChannelRegistry + NotifyTools 显式 @Bean</text>
  <rect x="650" y="150" width="180" height="40" rx="6" fill="#10203f" stroke="#3b82f6" stroke-width="1.2" filter="url(#sh)"/>
  <text x="740.0" y="167" text-anchor="middle" font-size="10" font-weight="bold" fill="#93c5fd">.axion/mcp_servers.yaml</text>
  <text x="740.0" y="182" text-anchor="middle" font-size="8" fill="#93c5fd">name/transport/command/env（stdio）</text>
  <rect x="650" y="205" width="180" height="40" rx="6" fill="#33151f" stroke="#fb7185" stroke-width="1.2" filter="url(#sh)"/>
  <text x="740.0" y="222" text-anchor="middle" font-size="10" font-weight="bold" fill="#fb7185">坑十三：MCP 失联只 WARN 跳过</text>
  <text x="740.0" y="237" text-anchor="middle" font-size="8" fill="#fb7185">其余工具照常注册——启动不炸</text>
  <rect x="650" y="260" width="180" height="40" rx="6" fill="#191233" stroke="#8b5cf6" stroke-width="1.2" filter="url(#sh)"/>
  <text x="740.0" y="277" text-anchor="middle" font-size="10" font-weight="bold" fill="#a78bfa">坑十二：契约三件套参数化</text>
  <text x="740.0" y="292" text-anchor="middle" font-size="8" fill="#a78bfa">name/description/inputSchema 缺一立刻红</text>
