  <text x="740.0" y="332" text-anchor="middle" font-size="10" font-weight="bold" fill="#9db0c9">明确不做</text>
  <text x="740.0" y="347" text-anchor="middle" font-size="8" fill="#9db0c9">Tool Policy/并行/SSE/容器沙箱 → 扩展阶段</text>
  <rect x="650" y="370" width="180" height="48" rx="6" fill="#263248" stroke="#7d8ca5" stroke-width="1.2" filter="url(#sh)"/>
  <text x="740.0" y="387" text-anchor="middle" font-size="10" font-weight="bold" fill="#9db0c9">PermissiveSandbox（拍板）</text>
  <text x="740.0" y="402" text-anchor="middle" font-size="8" fill="#9db0c9">临时全放行——20~23 节生产接线</text>
  <text x="740.0" y="416" text-anchor="middle" font-size="8" fill="#9db0c9">24 节无缝替换（002 FR-7）</text>
