  <rect x="230" y="452" width="310" height="34" rx="6" fill="#33151f" stroke="#fb7185" stroke-width="1.2" filter="url(#sh)"/>
  <text x="385.0" y="469" text-anchor="middle" font-size="10" font-weight="bold" fill="#fb7185">违规路径（坑十）：enforce 拒绝 → SandboxViolationException</text>
  <text x="385.0" y="483" text-anchor="middle" font-size="8" fill="#fb7185">IO 零发生 · 审计 success=false</text>
  <line x1="385" y1="445" x2="385" y2="450" stroke="#7d8ca5" stroke-width="1.3" marker-end="url(#a)"/>
