<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" font-family="Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 Z" fill="#64748b"/></marker>
    <filter id="sh"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="820" height="260" fill="#f8fafc" rx="6"/>
  <rect x="0" y="0" width="820" height="32" fill="#1e293b" rx="6"/>
  <rect x="0" y="16" width="820" height="16" fill="#1e293b"/>
  <text x="410" y="21" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="bold">AgentScheduler — 三种触发源共用一个引擎</text>

  <!-- Three triggers -->
  <rect x="30" y="55" width="230" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" filter="url(#sh)"/>
  <text x="145" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">💻 CLI Channel</text>
  <text x="145" y="94" text-anchor="middle" font-size="9" fill="#3b82f6">axion chat · 人推</text>

  <rect x="295" y="55" width="230" height="50" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" filter="url(#sh)"/>
  <text x="410" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d4ed8">🌐 Web Service</text>
  <text x="410" y="94" text-anchor="middle" font-size="9" fill="#3b82f6">REST API · 人推</text>

  <rect x="560" y="55" width="230" height="50" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="2" filter="url(#sh)"/>
  <text x="675" y="76" text-anchor="middle" font-size="11" font-weight="bold" fill="#15803d">⏰ AgentScheduler</text>
  <text x="675" y="94" text-anchor="middle" font-size="9" fill="#15803d">Cron 到点自动 · 钟推</text>

  <!-- Arrows to AgentService -->
  <line x1="145" y1="105" x2="145" y2="132" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="410" y1="105" x2="410" y2="132" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="675" y1="105" x2="675" y2="132" stroke="#10b981" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- AgentService -->
  <rect x="260" y="137" width="300" height="34" rx="17" fill="#334155" filter="url(#sh)"/>
  <text x="410" y="159" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">AgentService.process()</text>
  <line x1="410" y1="171" x2="410" y2="190" stroke="#64748b" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- ReActLoop -->
  <rect x="290" y="194" width="240" height="32" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="410" y="215" text-anchor="middle" font-size="11" fill="#b45309">ReActLoop · 不感知消息来源</text>

  <!-- Scheduler detail left -->
  <rect x="35" y="132" width="160" height="68" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="115" y="152" text-anchor="middle" font-size="9" font-weight="bold" fill="#475569">Scheduler 细节</text>
  <line x1="45" y1="158" x2="185" y2="158" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="45" y="175" font-size="8" fill="#64748b">ThreadPoolTaskScheduler</text>
  <text x="45" y="190" font-size="8" fill="#64748b">CronTrigger 动态注册</text>
  <text x="45" y="205" font-size="8" fill="#94a3b8">session_id: scheduler</text>

  <!-- Anti-overlap right -->
  <rect x="625" y="132" width="160" height="68" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="705" y="152" text-anchor="middle" font-size="9" font-weight="bold" fill="#475569">防重叠</text>
  <line x1="635" y1="158" x2="775" y2="158" stroke="#e2e8f0" stroke-width="0.5"/>
  <text x="635" y="175" font-size="8" fill="#64748b">ReentrantLock</text>
  <text x="635" y="190" font-size="8" fill="#64748b">按 task_id 维度</text>
  <text x="635" y="205" font-size="8" fill="#94a3b8">跳过不排队</text>

  <!-- Bottom -->
  <text x="410" y="252" text-anchor="middle" font-size="8" fill="#94a3b8">原则八：CLI、Web、Scheduler 共用同一 AgentService.process() 引擎</text>
</svg>