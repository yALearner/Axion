<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" font-family="Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 Z" fill="#64748b"/></marker>
    <marker id="aGray" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 Z" fill="#94a3b8"/></marker>
    <filter id="sh"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="860" height="430" fill="#f8fafc" rx="6"/>
  <rect x="0" y="0" width="860" height="32" fill="#1e293b" rx="6"/>
  <rect x="0" y="16" width="860" height="16" fill="#1e293b"/>
  <text x="430" y="21" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="bold">Agent Provider 调用链路 — 两层配置 · 显式映射 · 只翻译不执行 · 审计 day one</text>

  <!-- Global config -->
  <rect x="30" y="55" width="230" height="88" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" filter="url(#sh)"/>
  <text x="145" y="73" text-anchor="middle" font-size="9" font-weight="bold" fill="#1d4ed8">全局层 application.yaml</text>
  <text x="145" y="90" text-anchor="middle" font-size="8" fill="#1e40af">axion.providers:</text>
  <text x="145" y="105" text-anchor="middle" font-size="8" fill="#1e40af">name · api-key: ${ENV} · base-url</text>
  <text x="145" y="120" text-anchor="middle" font-size="8" fill="#1e40af">凭证只允许环境变量占位（禁明文）</text>

  <!-- Profile config -->
  <rect x="30" y="175" width="230" height="88" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2" filter="url(#sh)"/>
  <text x="145" y="193" text-anchor="middle" font-size="9" font-weight="bold" fill="#b45309">Profile 层（AGENT.md frontmatter）</text>
  <text x="145" y="210" text-anchor="middle" font-size="8" fill="#92400e">provider: name / model / temperature</text>
  <text x="145" y="225" text-anchor="middle" font-size="8" fill="#92400e">tools · mcp_servers · settings …</text>
  <text x="145" y="240" text-anchor="middle" font-size="8" fill="#92400e">（001 一次建全，后续节取用）</text>
  <line x1="145" y1="143" x2="145" y2="173" stroke="#f59e0b" stroke-width="1" marker-end="url(#a)"/>
  <text x="152" y="162" font-size="7.5" fill="#b45309">name 引用校验：不存在 → 报错</text>

  <!-- Config to spine -->
  <line x1="260" y1="99" x2="270" y2="99" stroke="#3b82f6" stroke-width="1.2"/>
  <line x1="270" y1="99" x2="270" y2="230" stroke="#3b82f6" stroke-width="1.2"/>
  <line x1="270" y1="230" x2="308" y2="230" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="260" y1="219" x2="285" y2="219" stroke="#f59e0b" stroke-width="1.2"/>
  <line x1="285" y1="219" x2="285" y2="150" stroke="#f59e0b" stroke-width="1.2"/>
  <line x1="285" y1="150" x2="308" y2="150" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- Caller -->
  <rect x="310" y="55" width="310" height="44" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" filter="url(#sh)"/>
  <text x="465" y="73" text-anchor="middle" font-size="9" font-weight="bold" fill="#334155">上层调用方（ReAct 循环，002 节起）</text>
  <text x="465" y="90" text-anchor="middle" font-size="8" fill="#475569">ProviderService.chat(sessionId, profile, prompt) — sessionId 供审计关联</text>

  <!-- ProviderService -->
  <rect x="310" y="119" width="310" height="64" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="465" y="139" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d28d9">ProviderService — 统一门面（对外唯一方法）</text>
  <text x="465" y="157" text-anchor="middle" font-size="8" fill="#7c3aed">挑对模型 → 发起调用 → 拿回结果（NFR-3 职责边界划窄）</text>
  <text x="465" y="173" text-anchor="middle" font-size="8" fill="#7c3aed">未知 provider → ProviderNotFoundException（不静默用错）</text>
  <line x1="465" y1="99" x2="465" y2="117" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Explicit map -->
  <rect x="310" y="203" width="310" height="54" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="2" filter="url(#sh)"/>
  <text x="465" y="221" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">显式映射 Map&lt;String, ChatModel&gt;（坑一）</text>
  <text x="465" y="239" text-anchor="middle" font-size="8" fill="#166534">provider name → ChatModel · 禁止扫描容器区分（Bean 类型相同、name 未必等于 provider name）</text>
  <line x1="465" y1="183" x2="465" y2="201" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ChatModel -->
  <rect x="310" y="277" width="310" height="48" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="465" y="295" text-anchor="middle" font-size="9" font-weight="bold" fill="#15803d">Spring AI ChatModel — 各家协议转换</text>
  <text x="465" y="311" text-anchor="middle" font-size="8" fill="#166534">格式差异由 Spring AI Alibaba 吸收（宪法 II 边界：协议转换 + @Tool schema）</text>
  <line x1="465" y1="257" x2="465" y2="275" stroke="#10b981" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- LLM APIs -->
  <rect x="310" y="345" width="310" height="40" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="465" y="369" text-anchor="middle" font-size="9" fill="#475569">DeepSeek · 通义 · Kimi … 各家 LLM API</text>
  <line x1="465" y1="325" x2="465" y2="343" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#aGray)"/>

  <!-- Tool schema -->
  <rect x="660" y="55" width="170" height="44" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" filter="url(#sh)"/>
  <text x="745" y="73" text-anchor="middle" font-size="9" font-weight="bold" fill="#334155">AxionTool（core 抽象）</text>
  <text x="745" y="90" text-anchor="middle" font-size="8" fill="#475569">name / description / schema / execute</text>

  <rect x="660" y="119" width="170" height="78" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2" filter="url(#sh)"/>
  <text x="745" y="137" text-anchor="middle" font-size="9" font-weight="bold" fill="#b45309">ToolSchemaAdapter</text>
  <text x="745" y="154" text-anchor="middle" font-size="8" fill="#92400e">→ Spring AI 工具格式</text>
  <text x="745" y="170" text-anchor="middle" font-size="8" fill="#92400e">只翻译，不执行（坑二）</text>
  <text x="745" y="186" text-anchor="middle" font-size="8" fill="#92400e">autoExecuteTools=false 钉死</text>
  <line x1="745" y1="99" x2="745" y2="117" stroke="#64748b" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="660" y1="158" x2="622" y2="158" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="640" y="168" font-size="7.5" fill="#b45309">工具列表（Function Calling 格式）</text>

  <!-- Audit -->
  <rect x="30" y="400" width="800" height="22" rx="5" fill="#fecdd3"/>
  <text x="430" y="415" text-anchor="middle" font-size="8.5" fill="#be123c">审计 day one：每次 LLM 调用成功与失败都写 llm_calls（session_id / provider / model / tokens / duration_ms / success / error_message）— 日志不等价于审计</text>
</svg>
