<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 715" font-family="Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 Z" fill="#64748b"/></marker>
    <marker id="aGray" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 Z" fill="#94a3b8"/></marker>
    <filter id="sh"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="860" height="715" fill="#f8fafc" rx="6"/>
  <rect x="0" y="0" width="860" height="32" fill="#1e293b" rx="6"/>
  <rect x="0" y="16" width="860" height="16" fill="#1e293b"/>
  <text x="430" y="21" text-anchor="middle" fill="#f1f5f9" font-size="12" font-weight="bold">插件化 Agent — 一个目录 = 一个 Agent · 扫描→派生→注册→到点自己跑 · 资源按需加载（宪法 IV 软连接）</text>
  <rect x="30" y="55" width="530" height="66" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2" filter="url(#sh)"/>
  <text x="295.0" y="72" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">入口：运营方丢目录 → .axion/agents/daily-reconcile/（一个目录 = 一个 Agent）</text>
  <text x="295.0" y="87" text-anchor="middle" font-size="8" fill="#92400e">AGENT.md（frontmatter 配置 + 正文指令）· REFERENCE.md · skills/ 绑定 · scripts/reconcile.py</text>
  <text x="295.0" y="101" text-anchor="middle" font-size="8" fill="#92400e">无 notify_channels（004 拍板）· 无 skills 字段（宪法 IV）</text>
  <rect x="30" y="155" width="530" height="66" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.2" filter="url(#sh)"/>
  <text x="295.0" y="172" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">AgentLoader 三步（ProfileLoader 更名，FR-1）</text>
  <text x="295.0" y="187" text-anchor="middle" font-size="8" fill="#166534">拆 frontmatter/正文（坑一）· 认资源（坑二：缺 name/provider 报错点名）· name=目录名（坑八）</text>
  <text x="295.0" y="201" text-anchor="middle" font-size="8" fill="#166534">deriveProfile → Profile（schedules 原样带进——定时来自 Agent）</text>
  <rect x="30" y="255" width="530" height="66" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1.2" filter="url(#sh)"/>
  <text x="295.0" y="272" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">注册：ProfileRegistry.register + exists/remove（FR-3）</text>
  <text x="295.0" y="287" text-anchor="middle" font-size="8" fill="#166534">AgentScheduler.registerProfile → scheduledTasks 句柄 + scheduled_tasks 登记（FR-4）</text>
  <text x="295.0" y="301" text-anchor="middle" font-size="8" fill="#166534">启动扫描与运行时新增同一段代码（坑五：同一异常同一消息）</text>
  <rect x="30" y="355" width="530" height="66" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.2" filter="url(#sh)"/>
  <text x="295.0" y="372" text-anchor="middle" font-size="10" font-weight="bold" fill="#6b21a8">到点触发（宪法 VIII：channel/user = scheduler）→ AgentService.process</text>
  <text x="295.0" y="387" text-anchor="middle" font-size="8" fill="#7e22ce">与 CLI/Web 同一入口——底座零重写（NFR-2）· 全程同步（NFR-1）</text>
  <text x="295.0" y="401" text-anchor="middle" font-size="8" fill="#7e22ce">PromptBuilder → ContextLoader 每轮现读（坑三：不缓存，正文即时生效）</text>
  <rect x="30" y="455" width="530" height="66" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.2" filter="url(#sh)"/>
  <text x="295.0" y="472" text-anchor="middle" font-size="10" font-weight="bold" fill="#6b21a8">ContextLoader.load = 正文（去 frontmatter）+ Bootstrap + Skill 元数据</text>
  <text x="295.0" y="487" text-anchor="middle" font-size="8" fill="#7e22ce">元数据 = name + description + 绑定路径 &lt;agentDir&gt;/skills/&lt;name&gt;/SKILL.md（⑦）</text>
  <text x="295.0" y="501" text-anchor="middle" font-size="8" fill="#7e22ce">AGENT.md 缺失报错（坑四：静默跳过 = 人格悄悄丢了）</text>
  <rect x="30" y="555" width="530" height="66" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.2" filter="url(#sh)"/>
  <text x="295.0" y="572" text-anchor="middle" font-size="10" font-weight="bold" fill="#6b21a8">资源按需加载（渐进式披露）：正文指引用底座既有工具</text>
  <text x="295.0" y="587" text-anchor="middle" font-size="8" fill="#7e22ce">read_file：FILE_READ 动态根 = 本 Agent 目录（坑七：未绑定/他 Agent 不可读）</text>
  <text x="295.0" y="601" text-anchor="middle" font-size="8" fill="#7e22ce">shell 跑脚本：解释器双白名单（③ 配置）· 简单形态限本 Agent scripts/（坑九；坑六 cwd=Agent 目录；代码不进上下文）</text>
  <rect x="30" y="655" width="800" height="50" rx="6" fill="#fecdd3" stroke="#be123c" stroke-width="1.2" filter="url(#sh)"/>
  <text x="430" y="674" text-anchor="middle" font-size="10" font-weight="bold" fill="#9f1239">审计 day one（宪法 V）：llm_calls + tool_invocations 成败都落账</text>
  <text x="430" y="688" text-anchor="middle" font-size="8" fill="#9f1239">失败路径：SandboxViolationException → success=false + error_message（不静默）· 加载报错点名</text>
  <rect x="600" y="55" width="230" height="66" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" filter="url(#sh)"/>
  <text x="715.0" y="72" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">notify_channels 表（004 拍板）</text>
  <text x="715.0" y="87" text-anchor="middle" font-size="8" fill="#1d4ed8">正文按名引用 team-ops</text>
  <text x="715.0" y="101" text-anchor="middle" font-size="8" fill="#1d4ed8">frontmatter 不含（不翻案）</text>
  <rect x="600" y="155" width="230" height="66" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2" filter="url(#sh)"/>
  <text x="715.0" y="172" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">公共 Skill 实体（宪法 IV 拍板）</text>
  <text x="715.0" y="187" text-anchor="middle" font-size="8" fill="#1d4ed8">.axion/skills/report-format/SKILL.md</text>
  <text x="715.0" y="201" text-anchor="middle" font-size="8" fill="#1d4ed8">软连接/junction 绑定 = 唯一真相源</text>
  <rect x="600" y="255" width="230" height="66" rx="6" fill="#fecdd3" stroke="#be123c" stroke-width="1.2" filter="url(#sh)"/>
  <text x="715.0" y="272" text-anchor="middle" font-size="10" font-weight="bold" fill="#9f1239">越界即拒（失败路径）</text>
  <text x="715.0" y="287" text-anchor="middle" font-size="8" fill="#9f1239">脚本出本 Agent scripts/ → 拒</text>
  <text x="715.0" y="301" text-anchor="middle" font-size="8" fill="#9f1239">无 Agent 上下文解释器 → 拒（⑥ fail-closed）</text>
  <rect x="600" y="355" width="230" height="166" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="5,3" filter="url(#sh)"/>
  <text x="715.0" y="372" text-anchor="middle" font-size="10" font-weight="bold" fill="#94a3b8">30 节 / 扩展阶段（本节不做）</text>
  <text x="715.0" y="387" text-anchor="middle" font-size="8" fill="#94a3b8">/api/v1/agents CRUD + 一句话生成（30 节）</text>
  <text x="715.0" y="401" text-anchor="middle" font-size="8" fill="#94a3b8">WorkspaceWatcher 监听（30 节）</text>
  <text x="715.0" y="415" text-anchor="middle" font-size="8" fill="#94a3b8">注销/更新消费本节句柄表（扩展）</text>
  <text x="715.0" y="429" text-anchor="middle" font-size="8" fill="#94a3b8">容器/网络隔离 · Agent 市场（扩展）</text>
  <line x1="295" y1="121" x2="295" y2="153" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="295" y1="221" x2="295" y2="253" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="295" y1="321" x2="295" y2="353" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="295" y1="421" x2="295" y2="453" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="295" y1="521" x2="295" y2="553" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="295" y1="621" x2="295" y2="653" stroke="#64748b" stroke-width="1.3" marker-end="url(#a)"/>
  <line x1="600" y1="88" x2="560" y2="575" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#aGray)"/>
  <line x1="600" y1="188" x2="560" y2="488" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#aGray)"/>
  <line x1="600" y1="288" x2="560" y2="600" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#aGray)"/>
  <line x1="600" y1="438" x2="560" y2="295" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#aGray)"/>
</svg>
